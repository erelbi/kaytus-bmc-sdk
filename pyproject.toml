[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kaytus-bmc-sdk"
version = "2.0.0"
description = "Python SDK for managing Kaytus BMC servers via the Redfish API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["kaytus", "bmc", "redfish", "ipmi", "server-management", "datacenter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Hardware",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28",
    "urllib3>=1.26",
]

[[project.authors]]
name = "Turksat Infrastructure Team"
email = "bilselergun@gmail.com"

[project.urls]
Homepage = "https://gitlab.com/erelbi/kaytus-bmc-sdk"
Repository = "https://gitlab.com/erelbi/kaytus-bmc-sdk"
"Bug Tracker" = "https://gitlab.com/erelbi/kaytus-bmc-sdk/-/issues"
Changelog = "https://gitlab.com/erelbi/kaytus-bmc-sdk/-/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["kaytus_sdk*"]
